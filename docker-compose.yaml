version: '3.8'

services:
  rolloutguardian-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HARNESS_ACCOUNT_ID=${HARNESS_ACCOUNT_ID:-mock-account}
      - HARNESS_API_KEY=${HARNESS_API_KEY:-mock-key}
      - ROLLOUTGUARDIAN_CONFIG=.rolloutguardian.yaml.example
    command: ["--config", ".rolloutguardian.yaml.example", "--port", "8080"]
    volumes:
      - ./examples:/root/examples
      - ./policies:/root/policies
    restart: unless-stopped
